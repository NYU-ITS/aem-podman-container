services:
  # -------------------------------------------------------------------
  # AEM AUTHOR
  # -------------------------------------------------------------------
  aem-author:
    build:
      context: .
      dockerfile: Containerfile
      args:
        RUN_MODE: author
        PORT: 4502
        CONTENT: ${AEM_CONTENT_TYPE:-nosamplecontent}
    container_name: aem-author
    ports:
      - "4502:4502"
      - "30333:30333"
    environment:
      JAVA_OPTS: >-
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
        -Djava.awt.headless=true
        -XX:+HeapDumpOnOutOfMemoryError
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:30333
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4502/libs/granite/core/content/login.html"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    volumes:
      - aem-author-home:/opt/aem/crx-quickstart:Z
      - ./install/author:/opt/aem/crx-quickstart/install:Z

volumes:
  aem-author-home:
